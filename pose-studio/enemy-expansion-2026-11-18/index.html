const catalog=new Map(JSON.parse(document.querySelector('#catalog').textContent).map(row=>[row.id,row]));
const dialog=document.querySelector('#viewer'), pose=document.querySelector('#pose'), sprite=document.querySelector('#sprite'), play=document.querySelector('#play'), sheet=document.querySelector('#sheet');
let active, timer=null, index=0, paused=false;
function stop(){if(timer!==null){clearInterval(timer);timer=null;}}
function paint(){const sequence=active.sets[pose.value]; sprite.src=active.root+sequence[index]+active.ext;sprite.alt=active.name+' · '+pose.value+' · frame '+(index+1);}
function refresh(){stop();const seq=active.sets[pose.value];index=0;paint();play.hidden=seq.length<2;play.textContent=paused?'Play':'Pause';if(!play.hidden&&!paused)timer=setInterval(()=>{index=(index+1)%seq.length;paint();},360);}
document.querySelector('main').addEventListener('click',e=>{const button=e.target.closest('.enemy');if(!button)return;active=catalog.get(button.dataset.id);document.querySelector('#name').textContent=active.name;pose.replaceChildren(...Object.keys(active.sets).map(key=>new Option(key,key)));pose.value=active.preview;sheet.hidden=!active.sheet;if(active.sheet)sheet.href=active.sheet;paused=matchMedia('(prefers-reduced-motion: reduce)').matches;refresh();dialog.showModal();});
pose.addEventListener('change',refresh);play.addEventListener('click',()=>{paused=!paused;refresh();});document.querySelector('#close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',stop);dialog.addEventListener('click',e=>{if(e.target===dialog&&!e.composedPath().some(n=>n instanceof Element&&n.id==='sprite')){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
document.querySelector('#role').addEventListener('change',e=>{const role=e.target.value;document.querySelectorAll('.enemy').forEach(b=>b.hidden=role!=='all'&&b.dataset.role!==role);document.querySelectorAll('[data-seat]').forEach(s=>s.hidden=!s.querySelector('.enemy:not([hidden])'));});
</script></body></html>
