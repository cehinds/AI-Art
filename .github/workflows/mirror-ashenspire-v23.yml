name: Mirror the existing AshenSpire v23 art release

on:
  push:
    branches: [ashenspire]
    paths:
      - .github/art-releases/ashenspire-v23.request.json
      - .github/scripts/mirror-ashenspire-v23.mjs
      - .github/workflows/mirror-ashenspire-v23.yml

permissions:
  contents: write

concurrency:
  group: ashenspire-v23-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/ashenspire'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /.github/art-releases/ashenspire-v23.request.json
            /.github/scripts/mirror-ashenspire-v23.mjs
            /.github/workflows/mirror-ashenspire-v23.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify and mirror the frozen source release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/mirror-ashenspire-v23.mjs .github/art-releases/ashenspire-v23.request.json
