<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" width="256" height="240" shape-rendering="crispEdges" font-family="Courier New,monospace"><title>Shop — editable schematic</title><desc>Provisional Final Fantasy II interface wireframe. Illustrative values, not an exact reference reconstruction.</desc><rect width="256" height="240" fill="#0c1727"/><rect x="5" y="5" width="246" height="230" fill="#101e31" stroke="#e9e5d6"/><text x="12" y="17" fill="#d2b17a" font-size="8">ARMORER / ALTAIR</text><path d="M12 24h232" stroke="#415367"/><text x="14" y="42" fill="#d2b17a" font-size="7">GIL  1,240</text><text x="164" y="42" fill="#8c9eae" font-size="6">SAMPLE STOCK</text><rect x="12" y="56" width="232" height="83" fill="#101e31" stroke="#e9e5d6"/><g data-action="item-sword" role="button" tabindex="0" aria-label="Broadsword                   100 G"><rect x="18" y="67" width="220" height="14" fill="#2b3d50" stroke="#d2b17a"/><text x="23" y="76" fill="#d2b17a" font-size="7">Broadsword                   100 G</text></g><g data-action="item-armor" role="button" tabindex="0" aria-label="Leather armor                 80 G"><rect x="18" y="90" width="220" height="14" fill="#101e31" stroke="#415367"/><text x="23" y="99" fill="#e9e5d6" font-size="7">Leather armor                 80 G</text></g><text x="23" y="124" fill="#8c9eae" font-size="6">Stock and prices are illustrative.</text><text x="15" y="158" fill="#8c9eae" font-size="7">QUANTITY</text><text x="108" y="158" fill="#d2b17a" font-size="7">01</text><text x="15" y="179" fill="#8c9eae" font-size="7">TOTAL</text><text x="108" y="179" fill="#d2b17a" font-size="7">100 G</text><g data-action="purchase" role="button" tabindex="0" aria-label="Review purchase"><rect x="14" y="197" width="155" height="14" fill="#101e31" stroke="#415367"/><text x="19" y="206" fill="#e9e5d6" font-size="7">Review purchase</text></g><text x="15" y="226" fill="#8c9eae" font-size="6">A: REVIEW   B: LEAVE</text></svg>
